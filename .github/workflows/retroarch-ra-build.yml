name: RAIntegration 1.4.2 Compatibility AutoRecall x64

on:
  push:
    branches: [retroarch-ra-build-clean]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper
        uses: actions/checkout@v5

      - name: Clone exact RAIntegration 1.4.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch RAIntegration.1.4.2 --recurse-submodules --shallow-submodules https://github.com/RetroAchievements/RAIntegration.git RAIntegrationSDK
          git -C RAIntegrationSDK describe --tags --exact-match
          if ((git -C RAIntegrationSDK describe --tags --exact-match) -ne 'RAIntegration.1.4.2') { throw 'Wrong RAIntegration source tag' }

      - name: Patch deferred UI Compatibility Test autorecall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/raintegration_compat_autorecall_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C RAIntegrationSDK diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C RAIntegrationSDK diff -- src/ui/viewmodels/UnknownGameViewModel.cpp

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build patched RAIntegration 1.4.2 x64
        shell: pwsh
        working-directory: RAIntegrationSDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msbuild.exe RA_Integration.sln -t:RA_Integration -p:Configuration=Release -p:Platform=x64 -m
          if (!(Test-Path 'bin\x64\Release\RA_Integration-x64.dll')) { throw 'RA_Integration-x64.dll was not produced' }

      - name: Verify v12 DLL
        shell: pwsh
        working-directory: RAIntegrationSDK
        run: |
          $dll = Resolve-Path 'bin\x64\Release\RA_Integration-x64.dll'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"
          Write-Host "Size=$((Get-Item $dll).Length)"
          Get-FileHash $dll -Algorithm SHA256 | Format-List
          if ($info.ProductVersion -notmatch '^1\.4\.2') { throw "Expected RAIntegration 1.4.2, got $($info.ProductVersion)" }

      - name: Package v12 DLL-only test
        shell: pwsh
        working-directory: RAIntegrationSDK
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'bin\x64\Release\RA_Integration-x64.dll' 'dist\RA_Integration.dll'
          git rev-parse HEAD | Out-File -Encoding ascii 'dist\RAINTEGRATION_SOURCE_COMMIT.txt'
          'RAIntegration.1.4.2' | Out-File -Encoding ascii 'dist\RAINTEGRATION_SOURCE_TAG.txt'
          @(
            'V12 DLL-only deferred-UI Compatibility Test autorecall build.',
            'Base: exact official RAIntegration 1.4.2 x64 source.',
            'Keep the already-working v7 retroarch-ra.exe unchanged.',
            'Back up the working RA_Integration.dll before testing.',
            'Replace ONLY RA_Integration.dll with this v12 DLL.',
            'A remembered Unknown Title -> Test association is detected after the title list is ready.',
            'Auto-Test completion is deferred until the asynchronous title-list callback has returned.',
            'The final close is performed only on the UI thread.',
            'No Link operation is used and the unknown hash is not registered on RetroAchievements.',
            'Achievements and leaderboards are not earned/submitted for the unknown hash in CompatibilityTest mode.'
          ) | Out-File -Encoding utf8 'dist\README_RA.txt'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIntegration-v12-1.4.2-DeferredUI-CompatAutoRecall-DLL
          path: RAIntegrationSDK/dist/
          retention-days: 7
